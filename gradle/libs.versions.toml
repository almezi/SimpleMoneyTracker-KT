[versions]
agp = "9.4.1"
kotlin = "2.4.20"
coreKtx = "1.10.1"
room3 = "3.0.3"        # Room KMP — verified stable on Maven 2026-10-12
sqlite = "2.7.1"       # androidx.sqlite bundled driver
composeBom = "2024.02.00"
datetime = "0.6.0"
lifecycle = "2.9.0"
serialization = "1.8.1"      # kotlinx.serialization — route objects in the shared NavGraph
navigation = "2.9.0-beta02"  # JetBrains multiplatform navigation (org.jetbrains.androidx.navigation)
savedstate = "1.3.0"         # Android SavedState, for the Android NavHost
activityCompose = "1.9.0"    # Android app module only

[libraries]
# Room KMP (shared module)
androidx-room3-runtime = { group = "androidx.room3", name = "room3-runtime", version.ref = "room3" }
androidx-room3-compiler = { group = "androidx.room3", name = "room3-compiler", version.ref = "room3" }
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "datetime" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Multiplatform navigation. androidx.navigation:navigation-compose is
# Android-only; this is the JetBrains build, which keeps the same package names
# but ships real iOS artifacts and typed @Serializable routes.
androidx-navigation-compose = { group = "org.jetbrains.androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# Route objects in the shared NavGraph are @Serializable, so consumers of
# :composeApp need kotlinx-serialization on their compile classpath.
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "serialization" }

# Backup JSON. The Android-only implementation used org.json plus
# SimpleDateFormat/Calendar, all JVM-only, so backups could not be
# produced on iOS at all. See docs/09 Stage 5 item 5.6.
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# Android-only. Backs the Android NavHost inside the multiplatform navigation.
androidx-savedstate = { group = "androidx.savedstate", name = "savedstate", version.ref = "savedstate" }

androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
androidx-room3 = { id = "androidx.room3", version.ref = "room3" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version = "2.3.12" }

